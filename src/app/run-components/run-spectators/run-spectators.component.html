<div class="container">
  <p class="title">Spectators</p>

  <div class="spectators">
    @for (spectator of spectators; track spectator.user.id) {
      <div>
        <p>
          <span class="name" >{{ spectator.user.name }}</span>
          @if (isHost && spectator.user.id !== userId) {
            <span class="kick" (click)="kickPlayer(spectator.user)">X</span>
          }
        </p>
      </div>
    }
  </div>
</div>

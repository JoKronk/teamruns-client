<div class="container">
  <p id="title">Add Player</p>
  @switch (phase) {
    @case (0) {
      <div>
        <p>Select account type and team for player</p>
        <div class="option-teams">
          <select [(ngModel)]="teamId">
            @for (team of data.run.teams; track team) {
              <option [ngValue]="team.id">{{ team.name }}</option>
            }
          </select>
        </div>
        <button (click)="phase = 1">Play as Guest</button>
        <button (click)="phase = 2">Login as User</button>
      </div>
    }

    @case (1) {
      <div>
        <div class="option">
          <p>Username</p>
          <input [(ngModel)]="username" (keyup.enter)="setUser()" maxlength="20">
        </div>
        <div class="buttons">
          <button class="cancel" (click)="close()">Cancel</button>
          <button (click)="setUser()">Next</button>
        </div>
      </div>
    }

    @case (2) {
      <div>
        <div class="option">
          <p>Username</p>
          <input [(ngModel)]="username" (keyup.enter)="setUser()" maxlength="20">
        </div>
        <div class="option">
          <p>Password</p>
          <input [(ngModel)]="pw" type="password" (keyup.enter)="setUser()" maxlength="32">
        </div>
        <div class="buttons">
          <button class="cancel" (click)="close()">Cancel</button>
          <button (click)="setUser()">Sign In</button>
        </div>
      </div>
    }

    @case (3) {
      <div>
        <p>Set the controller for the game, check that it works in game.</p>
        <div class="option">
          <p>Controller</p>
          <input type="number" min="0" max="8" [(ngModel)]="user.controllerPort" (change)="updateControllerPort()">
        </div>
        <div class="buttons">
          <button class="cancel" (click)="close()">Cancel</button>
          <button (click)="confirm()">Confirm</button>
        </div>
      </div>
    }
  }
</div>
